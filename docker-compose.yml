version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: buildnote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buildnote}
      POSTGRES_USER: ${POSTGRES_USER:-buildnote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buildnote_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buildnote} -d ${POSTGRES_DB:-buildnote}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: buildnote-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-buildnote_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-buildnote_minio_pass}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: buildnote-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-buildnote}:${POSTGRES_PASSWORD:-buildnote_dev_pass}@postgres:5432/${POSTGRES_DB:-buildnote}
      BLOB_STORE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: buildnote-blobs
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-buildnote_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-buildnote_minio_pass}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: info
    volumes:
      - api_blobs:/app/data/blobs
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  minio_data:
  api_blobs:
